# Normative requirement registry for the riko-memory package.
#
# Derived from Riko_Memory_V3_Master_Specification.md under the authority order recorded in spec-authority.md.
# Extraction recorded the Must and Conditional statements of V3 Part I sections 3 to 25 and all of Part II. It
# recorded no exploratory material, no suggested constant and no target value.
#
# Every entry still carries status: unassessed. Nothing here claims that a requirement is implemented, tested or
# verified. Mapping requirements to tests, checking that those tests ran, and checking the evidence grade are the
# next step.
#
# kind: behavior    an assertion about runtime behaviour; needs executed evidence at or above evidence_min.
# kind: acceptance  a project or evaluation rule; the gate machinery establishes it rather than a product test.
# evidence_min: static | unit | integration | loader_e2e | empirical | chaos
#
# Source section names and statements keep the specification wording, with one substitution: the repository bans a
# two-syllable origin term, so that word reads "source attribution" here and the section 11.7 heading is shortened.

