    section: "3. 不可破坏的系统不变量"
    line: 561
  level: MUST
  kind: behavior
  statement: >
    任何 benchmark、算法或外部项目都不得覆盖。
  evidence_min: static
  runtime_hint: []
  candidate_tests: []
  status: unassessed
REQ-AUTH-001:
