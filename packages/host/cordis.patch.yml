# Mount the Companion Memory Oracle acceptance tool.
#
# The evaluation can only run inside a DSH process: it needs a live context and
# the agent whose route the replies use. Installing this bundle therefore adds
# one tool, and calling that tool is what starts the run.
#
# `runCount` multiplies the frozen conversation, and the model calls multiply with
# it: one extraction and four replies per turn per repetition. The shipped
# acceptance criterion is written for ten.
- insert:
    - id: companion-memory-oracle
      name: '@companion-memory/host'
      config:
        outputDirectory: !!js process.env.COMPANION_MEMORY_EVAL_OUTPUT ?? dshHomePath('runs/oracle')
        workerCommand: !!js process.env.COMPANION_MEMORY_WORKER_COMMAND ?? 'companion-memory-worker'
        runCount: !!js Number(process.env.COMPANION_MEMORY_EVAL_RUNS ?? 10)
        includeProbes: !!js (process.env.COMPANION_MEMORY_EVAL_PROBES ?? 'true') !== 'false'
