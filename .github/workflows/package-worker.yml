name: package-companion-memory-worker

on:
  workflow_dispatch:
  push:
    tags: ['companion-memory-v*']

jobs:
  worker:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p companion-memory-worker
      - run: node scripts/package-worker.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: companion-memory-worker-${{ matrix.target }}
          path: packages/dsh-plugin/bin/

  bundle:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-memory-worker-*
          merge-multiple: true
          path: packages/dsh-plugin/bin
      - run: pnpm --filter @companion-memory/dsh-plugin build
      - run: pnpm pack --pack-destination ../../dist
        working-directory: packages/dsh-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: companion-memory-dsh-bundle
          path: dist/*.tgz
